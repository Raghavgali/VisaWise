# Prompt v2 on the held-out DEV split (dev_v1), Gemini 3.1 Flash-Lite. Used to
# tune the guardrail prompt WITHOUT touching curated_v1 (the held-out test set),
# so the final curated numbers stay an honest measurement, not a fit target.
name: dev_v2
dataset: dev_v1
metrics: all
engine:
  retriever: hybrid
  top_k: 8
  vector_weight: 0.6
  reranker: local
  rerank_top_n: 4
  prompt_version: v2
  llm: gemini:gemini-3.1-flash-lite
  thinking_budget: 0
