# Curated review set on the serving retrieval config + guardrail prompt v2.
# Same dataset/retriever/model as curated_review (v1 prompt) -- the ONLY change
# is prompt_version, so the before->after is a clean single-variable comparison
# of the guardrail's effect on the safety slices (and a regression check that
# the answer-bearing slices didn't drop).
name: curated_review_v2
dataset: curated_v1
metrics: all
engine:
  retriever: hybrid
  top_k: 8
  vector_weight: 0.6
  reranker: local
  rerank_top_n: 4
  prompt_version: v2
