[project]
name = "visawise"
version = "0.1.0"
description = "USCIS policy RAG chatbot with a first-class retrieval evaluation harness"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "trafilatura>=1.12",
    "langchain>=1.0",
    "langchain-text-splitters",
    "langchain-groq",
    "langchain-openai",
    "langchain-google-genai",
    "langgraph>=1.0",
    "ragas>=0.4.3,<0.5",
    # ragas 0.4.x imports modules removed in langchain-community 0.4
    "langchain-community>=0.3,<0.4",
    "lancedb>=0.15",
    "sentence-transformers>=5.6",
    "torch",  # explicit so tool.uv.sources routes the Linux image to the CPU wheel
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "typer>=0.12",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "cohere>=7.0.5",
    "rapidfuzz>=3.14.5",
    "sse-starlette>=3.4.5",
    "slowapi>=0.1.10",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-google-genai>=1.0b1",
]

[project.scripts]
visawise-ingest = "visawise.ingestion.cli:main"
visawise-eval = "visawise.evals.cli:main"
visawise-app = "visawise.app.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

# CPU-only torch for the Linux deploy image (no GPU is used; the default CUDA
# wheel is multi-GB). Scoped to Linux so macOS dev keeps resolving torch from
# PyPI (already CPU-only there) and `uv lock`/`sync` don't break locally.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/visawise"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
