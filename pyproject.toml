[project]
name = "visawise"
version = "0.1.0"
description = "USCIS policy RAG chatbot with a first-class retrieval evaluation harness"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "trafilatura>=1.12",
    "langchain>=1.0",
    "langchain-text-splitters",
    "langchain-groq",
    "langchain-openai",
    "langgraph>=1.0",
    "ragas>=0.4.3,<0.5",
    # ragas 0.4.x imports modules removed in langchain-community 0.4
    "langchain-community>=0.3,<0.4",
    "lancedb>=0.15",
    "sentence-transformers>=5.6",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "typer>=0.12",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "cohere>=7.0.5",
    "rapidfuzz>=3.14.5",
]

[project.scripts]
visawise-ingest = "visawise.ingestion.cli:main"
visawise-eval = "visawise.evals.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/visawise"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
